<div class="inline-drawer">
    <div class="inline-drawer-toggle inline-drawer-header">
        <b>Message Rewind Settings</b>
        <div class="inline-drawer-icon fa-solid fa-chevron-down down"></div>
    </div>
    <div class="inline-drawer-content" style="display: block;">
        <div class="flex-container flexFlowColumn">
            <label class="checkbox_label" style="margin: 10px 0; cursor: pointer;">
                <input type="checkbox" id="rewind_confirm_toggle" checked />
                <span>Require confirmation dialog before deleting messages</span>
            </label>
            <small style="color: rgba(255, 255, 255, 0.5);">
                Adds a rewind button to the bottom of every message card to truncate chat history.
            </small>
        </div>
    </div>
</div>
